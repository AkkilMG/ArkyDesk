name = "arkydesk"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Environment variables for development
[env.development.vars]
NODE_ENV = "development"

# Environment variables for preview
[env.preview.vars]
NODE_ENV = "production"

# Environment variables for production
[env.production.vars]
NODE_ENV = "production"

# Variables that can be set in all environments (non-sensitive)
[vars]
# Add any non-sensitive environment variables here

# Secrets configuration (sensitive data - use wrangler secret commands)
# These are placeholders - actual values should be set using:
# wrangler secret put SECRET_KEY
# wrangler secret put SESSION_SECRET
# wrangler secret put MONGODB_URI
# wrangler secret put MONGODB_DB
# wrangler secret put BASE_URL
# wrangler secret put SMTP_HOST
# wrangler secret put SMTP_PORT
# wrangler secret put SMTP_USER
# wrangler secret put SMTP_PASS

# For different environments, use:
# wrangler secret put SECRET_KEY --env production
# wrangler secret put SECRET_KEY --env preview
